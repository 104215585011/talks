services:
  postgres:
    image: postgres:17-bookworm
    container_name: linguaai-postgres
    environment:
      POSTGRES_DB: linguaai_dev
      POSTGRES_USER: linguaai
      POSTGRES_PASSWORD: linguaai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguaai -d linguaai_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
